<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TITAN CORE OS</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --cyan: #00f3ff;
            --pink: #ff00ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, system-ui, sans-serif; height: 100vh; overflow: hidden; }

        /* Фоновые эффекты */
        .scanline { position: fixed; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5) 50%); background-size: 100% 4px; z-index: 10; pointer-events: none; opacity: 0.1; }

        /* Панель управления */
        .glass-panel { background: rgba(15, 15, 20, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }

        /* Шапка */
        .header { height: 180px; position: relative; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 0 0 25px 25px; overflow: hidden; }
        #canvas-3d { position: absolute; inset: 0; z-index: 0; opacity: 0.6; }
        .top-info { position: relative; z-index: 1; display: flex; justify-content: space-between; font-family: monospace; font-size: 10px; color: var(--cyan); }

        /* Контент */
        .content { height: calc(100vh - 260px); overflow-y: auto; padding: 20px; }
        .view { display: none; }
        .view.active { display: block; }

        /* Кнопки и Карточки */
        .card { padding: 15px; margin-bottom: 12px; transition: 0.3s; cursor: pointer; }
        .card.active { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        
        .pay-btn { 
            width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 800; 
            margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; 
        }

        /* Ачивки */
        .ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ach-item { text-align: center; opacity: 0.2; filter: grayscale(1); transition: 0.5s; }
        .ach-item.unlocked { opacity: 1; filter: grayscale(0); color: var(--cyan); }

        /* Навигация */
        .nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 65px; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-i { font-size: 20px; color: rgba(255,255,255,0.2); transition: 0.3s; }
        .nav-i.active { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }

        /* Загрузка */
        #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bar { width: 150px; height: 2px; background: #222; margin-top: 10px; }
        .fill { height: 100%; background: var(--cyan); width: 0%; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    
    <div id="loader">
        <h2 style="letter-spacing: 8px;">TITAN CORE</h2>
        <div class="bar"><div class="fill"></div></div>
    </div>

    <div class="header glass-panel">
        <div id="canvas-3d"></div>
        <div class="top-info">
            <span id="node-id">NODE: CONNECTING...</span>
            <span id="balance-display" style="font-weight: bold;">CREDITS: 0</span>
        </div>
        <div style="position: relative; z-index: 1;">
            <p style="font-size: 10px; opacity: 0.5;">BIOMETRIC AUTHENTICATED</p>
            <h1 id="user-title" style="font-size: 28px;">USER_NAME</h1>
        </div>
    </div>

    <div class="content">
        <div id="chat" class="view active">
            <div class="card glass-panel active" onclick="App.setModel('GPT-5', this)">
                <i class="fa-solid fa-brain"></i> GPT-5 OMNI <small>(FAST)</small>
            </div>
            <div class="card glass-panel" onclick="App.setModel('CLAUDE', this)">
                <i class="fa-solid fa-bolt"></i> CLAUDE 3.5 <small>(PRO)</small>
            </div>
            <div class="glass-panel" style="padding: 10px; display: flex; margin-top: 20px;">
                <input type="text" id="prompt" placeholder="Enter command..." style="flex:1; background:none; border:none; color:#fff; outline:none; padding:10px;">
                <button onclick="App.send()" style="background:var(--cyan); border:none; width:40px; border-radius:10px;"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>

        <div id="profile" class="view">
            <h3 style="margin-bottom:15px;">RECHARGE SYSTEM</h3>
            <button class="pay-btn" style="background:#ffd700; color:#000;" onclick="App.pay('stars')">
                <i class="fa-solid fa-star"></i> TELEGRAM STARS
            </button>
            <button class="pay-btn" style="background:#00a3ff; color:#fff;" onclick="App.pay('crypto')">
                <i class="fa-solid fa-wallet"></i> CRYPTO BOT
            </button>
            <button class="pay-btn" style="background:#fff; color:#003087;" onclick="App.pay('paypal')">
                <i class="fa-brands fa-paypal"></i> PAYPAL
            </button>
        </div>

        <div id="ach" class="view">
            <h3>ACHIEVEMENTS</h3>
            <div class="ach-grid" style="margin-top: 20px;">
                <div class="ach-item glass-panel card" id="ach-boot"><i class="fa-solid fa-power-off"></i><p>Boot</p></div>
                <div class="ach-item glass-panel card" id="ach-pro"><i class="fa-solid fa-crown"></i><p>Titan Pro</p></div>
            </div>
        </div>
    </div>

    <nav class="nav glass-panel">
        <div class="nav-i active" onclick="App.view('chat', this)"><i class="fa-solid fa-terminal"></i></div>
        <div class="nav-i" onclick="App.view('profile', this)"><i class="fa-solid fa-credit-card"></i></div>
        <div class="nav-i" onclick="App.view('ach', this)"><i class="fa-solid fa-trophy"></i></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // ССЫЛКА НА ТВОЙ ВОРКЕР (ЗАМЕНИ!)
        const API_URL = "https://твой-воркер.workers.dev";

        const App = {
            userId: tg.initDataUnsafe?.user?.id || 0,
            userName: tg.initDataUnsafe?.user?.first_name || "Guest",
            model: "GPT-5",

            async init() {
                document.getElementById('user-title').innerText = this.userName.toUpperCase();
                document.getElementById('node-id').innerText = `NODE: ${this.userId}`;
                
                try {
                    const res = await fetch(`${API_URL}/get-user?id=${this.userId}`);
                    const data = await res.json();
                    document.getElementById('balance-display').innerText = `CREDITS: ${data.credits || 0}`;
                    this.syncAch(JSON.parse(data.achievements || '["boot"]'));
                } catch (e) { console.log("Offline mode"); }
            },

            view(id, el) {
                tg.HapticFeedback.impactOccurred('medium');
                document.querySelectorAll('.nav-i').forEach(n => n.classList.remove('active'));
                el.classList.add('active');
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            },

            setModel(m, el) {
                tg.HapticFeedback.selectionChanged();
                this.model = m;
                document.querySelectorAll('#chat .card').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
            },

            syncAch(list) {
                list.forEach(a => document.getElementById(`ach-${a}`)?.classList.add('unlocked'));
            },

            send() {
                const text = document.getElementById('prompt').value;
                if(!text) return;
                tg.sendData(JSON.stringify({ action: "generate", model: this.model, prompt: text }));
                tg.close();
            },

            pay(method) {
                tg.HapticFeedback.notificationOccurred('success');
                tg.sendData(JSON.stringify({ action: "create_payment", method: method }));
                tg.close();
            }
        };

        // 3D Графика
        const Renderer3D = {
            init() {
                const container = document.getElementById('canvas-3d');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true });
                renderer.setSize(container.offsetWidth, container.offsetHeight);
                container.appendChild(renderer.domElement);

                const geometry = new THREE.SphereGeometry(2, 32, 32);
                const material = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.2 });
                const sphere = new THREE.Mesh(geometry, material);
                scene.add(sphere);
                camera.position.z = 5;

                function anim() {
                    requestAnimationFrame(anim);
                    sphere.rotation.y += 0.002;
                    renderer.render(scene, camera);
                }
                anim();
            }
        };

        window.onload = () => {
            App.init();
            Renderer3D.init();
            gsap.to('.fill', { width: '100%', duration: 1, onComplete: () => {
                gsap.to('#loader', { opacity: 0, duration: 0.4, onComplete: () => document.getElementById('loader').style.display='none' });
            }});
        };
    </script>
</body>
</html>
