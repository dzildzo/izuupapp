<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PoulAI Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --bg: #050505; 
            --card: #121214; 
            --accent: #00d2ff; 
            --grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
        }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            padding: 15px; 
            overflow: hidden; 
        }
        
        .page { display: none; height: 100vh; flex-direction: column; }
        .active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Баланс */
        .balance-card { 
            background: var(--grad); 
            border-radius: 28px; 
            padding: 35px 20px; 
            text-align: center; 
            margin-bottom: 25px; 
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.25);
            position: relative;
            overflow: hidden;
        }

        .btn { 
            background: var(--card); border: 1px solid #222; padding: 18px; 
            border-radius: 20px; width: 100%; color: white; font-weight: 600; 
            margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); background: #1a1a1c; }
        .btn i { color: var(--accent); font-size: 18px; }

        /* Стили чата */
        #chat-window { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 10px; 
            padding-bottom: 180px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .ai-msg { background: #1c1c1e; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user-msg { background: var(--accent); color: black; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; }
        
        .chat-input-area { 
            position: fixed; bottom: 95px; left: 15px; right: 15px; 
            display: flex; gap: 10px; background: var(--bg); padding: 10px 0;
        }
        input { 
            background: #161618; border: 1px solid #333; color: white; 
            padding: 15px; border-radius: 18px; flex: 1; outline: none; 
        }

        /* Навигация */
        .nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(10,10,12,0.85);
            backdrop-filter: blur(15px); 
            display: flex; justify-content: space-around; 
            padding: 18px 0 32px; border-top: 1px solid #1a1a1a; 
            z-index: 100;
        }
        .nav i { color: #444; font-size: 22px; transition: 0.3s; cursor: pointer;}
        .nav i.active { color: var(--accent); text-shadow: 0 0 15px rgba(0,210,255,0.6); }

        /* Магазин */
        .offer { background: #161618; border: 1px solid #282828; padding: 20px; border-radius: 22px; margin-bottom: 15px; }
        .price-tag { background: var(--accent); color: black; padding: 6px 14px; border-radius: 12px; font-weight: 800; }
    </style>
</head>
<body>

    <div id="p-home" class="page active">
        <div class="balance-card">
            <p style="margin:0; opacity:0.8; font-size: 13px; text-transform: uppercase;">Мой баланс</p>
            <h1 id="bal-view" style="font-size: 52px; margin: 8px 0;">0 VC</h1>
        </div>
        <button class="btn" onclick="showP('chat')"><span>Запустить интеллект</span> <i class="fa-solid fa-bolt"></i></button>
        <button class="btn" onclick="showP('shop')"><span>Пополнить VC</span> <i class="fa-solid fa-wallet"></i></button>
        <button class="btn" onclick="showP('profile')"><span>Настройки профиля</span> <i class="fa-solid fa-user-gear"></i></button>
    </div>

    <div id="p-chat" class="page">
        <div id="chat-window">
            <div class="msg ai-msg">Привет! Я готов к работе. Какой у тебя вопрос?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="c-inp" placeholder="Введите ваш запрос...">
            <button class="btn" style="width: 55px; margin: 0; justify-content: center; background: var(--accent);" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane" style="color: black;"></i>
            </button>
        </div>
    </div>

    <div id="p-shop" class="page">
        <h2 style="margin: 10px 0 20px 10px;">Тарифные планы</h2>
        <div class="offer" onclick="sendB('buy_pro')">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <b>Тариф PRO</b> <span class="price-tag">1400 VC</span>
            </div>
            <p style="font-size:13px; opacity:0.6; margin-top:10px;">Gemini 1.5 Flash. Быстрые ответы.</p>
        </div>
        <div class="offer" style="border-color: var(--accent);" onclick="sendB('buy_ultimate')">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <b style="color: var(--accent);">Тариф ULTIMATE</b> <span class="price-tag">2300 VC</span>
            </div>
            <p style="font-size:13px; opacity:0.6; margin-top:10px;">Gemini Pro. Самый мощный интеллект.</p>
        </div>
        <button class="btn" style="border-color: #00d2ff;" onclick="sendB('pay_crypto')">💎 Пополнить через CryptoBot</button>
    </div>

    <div id="p-profile" class="page">
        <h2 style="margin-left: 10px;">Профиль</h2>
        <div class="offer">
            <p>ID: <code id="u-id">0</code></p>
            <p>Статус: <b id="u-sub" style="color:var(--accent)">FREE</b></p>
        </div>
        <div style="padding: 10px;">
            <input type="text" id="promo-input" placeholder="Введите промокод..." style="width:100%; margin-bottom:10px;">
            <button class="btn" style="background: var(--accent); color: black; justify-content: center;" onclick="applyPromo()">Активировать</button>
        </div>
    </div>

    <div class="nav">
        <i class="fa-solid fa-house active" onclick="showP('home')"></i>
        <i class="fa-solid fa-comment-dots" onclick="showP('chat')"></i>
        <i class="fa-solid fa-cart-shopping" onclick="showP('shop')"></i>
        <i class="fa-solid fa-user" onclick="showP('profile')"></i>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        document.getElementById('bal-view').innerText = (params.get('bal') || '0') + ' VC';
        document.getElementById('u-sub').innerText = (params.get('sub') || 'free').toUpperCase();
        document.getElementById('u-id').innerText = tg.initDataUnsafe.user?.id || '6369970333';

        function showP(id) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            
            document.querySelectorAll('.nav i').forEach(i => i.classList.remove('active'));
            const map = {home: 0, chat: 1, shop: 2, profile: 3};
            document.querySelectorAll('.nav i')[map[id]].classList.add('active');
        }

        function sendB(d) { tg.sendData(d); tg.close(); }

        function applyPromo() {
            const val = document.getElementById('promo-input').value;
            if(val) { tg.sendData("promo:" + val); tg.close(); }
        }

        function sendMessage() {
            const inp = document.getElementById('c-inp');
            const win = document.getElementById('chat-window');
            if(!inp.value) return;
            
            // Добавляем сообщение юзера в окно
            win.innerHTML += `<div class="msg user-msg">${inp.value}</div>`;
            
            // Отправляем боту в чат
            tg.sendData("msg:" + inp.value);
            
            inp.value = "";
            win.scrollTo(0, win.scrollHeight);
            
            // Закрываем приложение, чтобы увидеть ответ бота в ТГ
            setTimeout(() => { tg.close(); }, 500);
        }
    </script>
</body>
</html>
