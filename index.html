<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --main: #00d2ff; --bg: #000; --card: #111; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-top: 15px; border: 1px solid #222; }
        .neon-btn { background: var(--main); color: #000; padding: 15px; border-radius: 12px; font-weight: 800; text-align: center; margin: 10px 0; box-shadow: 0 0 15px var(--main); }
        .tab-nav { display: flex; justify-content: space-around; margin-top: 20px; background: #0a0a0a; padding: 15px; border-radius: 20px; }
        .tab-nav i { font-size: 20px; color: #444; }
        .tab-nav i.active { color: var(--main); text-shadow: 0 0 10px var(--main); }
        select, textarea, input { width: 100%; background: #1a1a1c; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; box-sizing: border-box; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div><span style="color:var(--main)">●</span> POUL AI</div>
    <div id="bal" style="font-weight:bold">0 VC</div>
</div>

<div id="p-home">
    <div class="card">
        <small style="color:#555">SYSTEM STATUS</small>
        <h3 id="sub">FREE VERSION</h3>
        <div style="height:4px; background:#222; border-radius:2px;">
            <div style="width:30%; height:100%; background:var(--main); box-shadow:0 0 10px var(--main)"></div>
        </div>
    </div>
    <div class="neon-btn" onclick="pay('ULTRA')">UPGRADE TO ULTRA ($23.0)</div>
    <div class="neon-btn" style="background:#fff; box-shadow:none;" onclick="pay('PRO')">UPGRADE TO PRO ($14.0)</div>
    
    <input type="text" id="promo" placeholder="Ввести промокод...">
    <button onclick="sendPromo()" style="width:100%; background:none; border:1px solid #333; color:white; padding:10px; margin-top:5px; border-radius:10px;">АКТИВИРОВАТЬ</button>
</div>

<div id="p-ai" style="display:none">
    <div class="card">
        <select id="model">
            <option value="GPT4">GPT-4o Platinum</option>
            <option value="CLAUDE">Claude 3.5 Sonnet</option>
            <option value="GEMINI">Gemini 1.5 Pro</option>
        </select>
        <textarea id="msg" placeholder="Твой запрос к ИИ..."></textarea>
        <div class="neon-btn" onclick="sendAi()">ОТПРАВИТЬ ЗАПРОС</div>
    </div>
</div>

<div class="tab-nav">
    <i class="fa-solid fa-house active" id="n-home" onclick="tab('home')"></i>
    <i class="fa-solid fa-robot" id="n-ai" onclick="tab('ai')"></i>
    <i class="fa-solid fa-gear" onclick="tg.showAlert('Настройки скоро!')"></i>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function tab(id) {
        document.getElementById('p-home').style.display = id === 'home' ? 'block' : 'none';
        document.getElementById('p-ai').style.display = id === 'ai' ? 'block' : 'none';
        document.getElementById('n-home').classList.toggle('active', id === 'home');
        document.getElementById('n-ai').classList.toggle('active', id === 'ai');
    }

    function pay(plan) {
        tg.HapticFeedback.impactOccurred('heavy');
        tg.sendData(`pay_crypto_${plan}`);
    }

    function sendAi() {
        const m = document.getElementById('model').value;
        const txt = document.getElementById('msg').value;
        if(!txt) return;
        tg.sendData(`ai:${m}|${txt}`);
        tg.close();
    }

    function sendPromo() {
        const c = document.getElementById('promo').value;
        tg.sendData("promo:" + c);
    }

    const u = new URLSearchParams(window.location.search);
    document.getElementById('bal').innerText = (u.get('bal') || 0) + ' VC';
    document.getElementById('sub').innerText = (u.get('sub') || 'free').toUpperCase() + ' VERSION';
</script>
</body>
</html>
