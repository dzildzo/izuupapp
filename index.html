<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TITAN CORE: ULTIMATE</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

        :root {
            --cyan: #00f3ff;
            --cyan-dark: #00c4cf;
            --pink: #ff00ff;
            --pink-dark: #cf00cf;
            --gold: #ffd700;
            --gold-dark: #cfaf00;
            --purple: #bf00ff;
            --bg-dark: #000000;
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(0, 243, 255, 0.1);
            --blur-strong: blur(40px);
            --blur-medium: blur(20px);
            --ease-ios: cubic-bezier(0.25, 0.1, 0.25, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'JetBrains Mono', monospace; 
            height: 100vh; 
            overflow: hidden; 
            letter-spacing: -0.3px;
        }

        /* ЖИВОЙ ГРАДИЕНТНЫЙ ФОН */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(135deg, #0a0a0f 0%, #0d0d1a 50%, #050510 100%);
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.3) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 255, 0.2) 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(191, 0, 255, 0.25) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(20px, 30px) scale(1.02); }
        }

        /* LIQUID GLASS КАРТОЧКИ */
        .liquid-glass {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.03) 0%,
                rgba(255, 255, 255, 0.01) 100%
            );
            backdrop-filter: var(--blur-strong);
            -webkit-backdrop-filter: var(--blur-strong);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            box-shadow: 
                var(--shadow-soft),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            transition: all 0.4s var(--ease-out);
        }

        .liquid-glass:hover {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.05) 0%,
                rgba(255, 255, 255, 0.02) 100%
            );
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 12px 48px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 0 60px rgba(0, 243, 255, 0.05);
        }

        /* HEADER С LIQUID EFFECT */
        .header {
            height: 240px;
            padding: 24px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(0, 243, 255, 0.08) 0%, transparent 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.5), transparent);
        }

        #canvas-3d {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .user-card {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar-frame {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.3), rgba(255, 0, 255, 0.2));
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .avatar-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: rgba(10, 10, 15, 0.9);
            z-index: 1;
        }

        .avatar-frame img {
            position: absolute;
            inset: 2px;
            width: calc(100% - 4px);
            height: calc(100% - 4px);
            border-radius: 16px;
            object-fit: cover;
            z-index: 2;
        }

        .user-info h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info .version {
            font-size: 10px;
            opacity: 0.4;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            z-index: 10;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.3s var(--ease-out);
        }

        .stat-badge:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .stat-badge#u-level {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.1), rgba(191, 0, 255, 0.05));
            border-color: rgba(255, 0, 255, 0.2);
        }

        /* MAIN CONTENT С ПЛАВНЫМИ ПЕРЕХОДАМИ */
        .viewport {
            height: calc(100vh - 320px);
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .viewport::-webkit-scrollbar {
            width: 4px;
        }

        .viewport::-webkit-scrollbar-track {
            background: transparent;
        }

        .viewport::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .view {
            display: none;
            opacity: 0;
            transform: translateY(15px) scale(0.98);
        }

        .view.active {
            display: block;
            animation: viewEnter 0.5s var(--ease-out) forwards;
        }

        @keyframes viewEnter {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* NEURAL GRID - 15 MODELS С LIQUID GLASS */
        .ai-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 100px;
        }

        .ai-card {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.02) 0%,
                rgba(255, 255, 255, 0.01) 100%
            );
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s var(--ease-out);
            cursor: pointer;
        }

        .ai-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0, 243, 255, 0.08) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .ai-card:hover::before {
            opacity: 1;
        }

        .ai-card:active {
            transform: scale(0.96);
        }

        .ai-card.active {
            background: linear-gradient(
                135deg,
                rgba(0, 243, 255, 0.08) 0%,
                rgba(0, 243, 255, 0.02) 100%
            );
            border-color: rgba(0, 243, 255, 0.3);
            border-top-color: rgba(0, 243, 255, 0.5);
            box-shadow: 
                0 0 40px rgba(0, 243, 255, 0.1),
                inset 0 0 0 1px rgba(0, 243, 255, 0.05);
            transform: translateY(-2px);
        }

        .ai-card i {
            font-size: 22px;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            display: inline-block;
        }

        .ai-card .name {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: #fff;
        }

        .ai-card .desc {
            font-size: 10px;
            opacity: 0.4;
            margin-top: 6px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* ACHIEVEMENTS С BLUR EFFECT */
        .ach-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ach-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            filter: grayscale(1);
            opacity: 0.4;
            transition: all 0.6s var(--ease-out);
        }

        .ach-card.unlocked {
            filter: grayscale(0);
            opacity: 1;
            background: linear-gradient(
                135deg,
                rgba(255, 215, 0, 0.08) 0%,
                rgba(255, 215, 0, 0.02) 100%
            );
            border-color: rgba(255, 215, 0, 0.3);
            border-top-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }

        .ach-icon {
            font-size: 28px;
            background: linear-gradient(135deg, var(--gold), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ach-card .name {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        .ach-card .desc {
            font-size: 11px;
            opacity: 0.5;
            font-weight: 300;
        }

        /* INPUT AREA С GLASSMORPHISM */
        .input-container {
            position: fixed;
            bottom: 100px;
            left: 16px;
            right: 16px;
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 24px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1000;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s var(--ease-out);
        }

        .input-container:focus-within {
            background: rgba(15, 15, 25, 0.8);
            border-color: rgba(0, 243, 255, 0.3);
            box-shadow: 
                0 12px 48px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 243, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .input-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 14px 16px;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            font-weight: 400;
        }

        .input-container input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--cyan), var(--cyan-dark));
            border: none;
            border-radius: 18px;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s var(--ease-out);
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.3);
        }

        .send-btn:active {
            transform: scale(0.92);
            box-shadow: 0 2px 12px rgba(0, 243, 255, 0.2);
        }

        .send-btn i {
            font-size: 18px;
        }

        /* NAV BAR С FLOATING EFFECT */
        .nav-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 76px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            background: rgba(15, 15, 25, 0.5);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 0 8px;
        }

        .nav-btn {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.25);
            transition: all 0.4s var(--ease-out);
            position: relative;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            cursor: pointer;
        }

        .nav-btn:active {
            transform: scale(0.9);
        }

        .nav-btn.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(0, 243, 255, 0.05));
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        .nav-btn.active i {
            transform: translateY(-2px);
        }

        /* LOADER С MODERN ANIMATION */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 8px;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .loader-bar {
            width: 240px;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .loader-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
            border-radius: 2px;
            width: 0%;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        /* PAYMENT BUTTONS */
        .pay-btn {
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            cursor: pointer;
            transition: all 0.4s var(--ease-out);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .pay-btn:active {
            transform: scale(0.97);
        }

        .pay-btn:first-child {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.2);
        }

        .pay-btn:nth-child(2) {
            background: rgba(34, 34, 34, 0.8);
            color: var(--cyan);
            border: 1px solid var(--cyan);
            box-shadow: 0 8px 24px rgba(0, 243, 255, 0.1);
        }

        .pay-btn:last-child {
            background: linear-gradient(135deg, #003087, #0045bd);
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 48, 135, 0.3);
        }

        /* SECTION TITLES */
        .section-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            opacity: 0.5;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        /* RESPONSIVE */
        @media (max-width: 380px) {
            .ai-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <!-- AMBIENT BACKGROUND -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <div id="loader">
        <div class="loader-logo">TITAN CORE</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <div class="header">
        <div id="canvas-3d"></div>
        <div class="user-card">
            <div class="avatar-frame">
                <img id="u-avatar" src="https://ui-avatars.com/api/?background=0D0D0D&color=00f3ff" alt="Avatar">
            </div>
            <div class="user-info">
                <h2 id="u-name">AUTHORIZED UNIT</h2>
                <div class="version">OS VERSION: 5.0.0 • STABLE</div>
            </div>
        </div>
        <div class="stats-row">
            <div class="stat-badge" id="u-credits">CREDITS: 0</div>
            <div class="stat-badge" id="u-level">LVL: 1 • NOVICE</div>
        </div>
    </div>

    <div class="viewport">
        <div id="view-ai" class="view active">
            <h3 class="section-title">Neural Node Selection</h3>
            <div class="ai-grid" id="ai-container"></div>
        </div>

        <div id="view-ach" class="view">
            <h3 class="section-title">Trophy Repository</h3>
            <div class="ach-list" id="ach-container">
                <div class="ach-card" id="ach-boot">
                    <div class="ach-icon"><i class="fa-solid fa-power-off"></i></div>
                    <div>
                        <div class="name">First Boot</div>
                        <div class="desc">Initialize the Titan System</div>
                    </div>
                </div>
                <div class="ach-card" id="ach-rich">
                    <div class="ach-icon"><i class="fa-solid fa-gem"></i></div>
                    <div>
                        <div class="name">Collector</div>
                        <div class="desc">Accumulate 1000+ credits</div>
                    </div>
                </div>
                <div class="ach-card" id="ach-pro">
                    <div class="ach-icon"><i class="fa-solid fa-crown"></i></div>
                    <div>
                        <div class="name">Titan Pro</div>
                        <div class="desc">Unlock all neural links</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-pay" class="view">
            <h3 class="section-title">Financial Terminal</h3>
            <button class="pay-btn" onclick="App.pay('stars')">
                <i class="fa-solid fa-star"></i>&nbsp;&nbsp;TELEGRAM STARS
            </button>
            <button class="pay-btn" onclick="App.pay('crypto')">
                <i class="fa-solid fa-bolt"></i>&nbsp;&nbsp;CRYPTO BOT
            </button>
            <button class="pay-btn" onclick="App.pay('paypal')">
                <i class="fa-brands fa-paypal"></i>&nbsp;&nbsp;PAYPAL GLOBAL
            </button>
        </div>
    </div>

    <div class="input-container" id="chat-input-box">
        <input type="text" id="main-prompt" placeholder="Execute command..." autocomplete="off">
        <button class="send-btn" onclick="App.send()">
            <i class="fa-solid fa-arrow-up"></i>
        </button>
    </div>

    <nav class="nav-bar">
        <div class="nav-btn active" onclick="App.switch('ai', this)">
            <i class="fa-solid fa-microchip"></i>
        </div>
        <div class="nav-btn" onclick="App.switch('ach', this)">
            <i class="fa-solid fa-trophy"></i>
        </div>
        <div class="nav-btn" onclick="App.switch('pay', this)">
            <i class="fa-solid fa-wallet"></i>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const API_URL = "https://твой-воркер.workers.dev";

        const models = [
            { id: 'gpt4', name: 'GPT-4o', icon: 'fa-brain', d: 'Omni intelligence' },
            { id: 'o1', name: 'OpenAI o1', icon: 'fa-microchip', d: 'Reasoning model' },
            { id: 'claude', name: 'Claude 3.5', icon: 'fa-feather', d: 'Natural writing' },
            { id: 'gemini', name: 'Gemini 1.5', icon: 'fa-google', d: 'Fast & Smart' },
            { id: 'llama', name: 'Llama 3.1', icon: 'fa-dragon', d: 'Meta Open Source' },
            { id: 'mistral', name: 'Mistral Large', icon: 'fa-wind', d: 'Efficient AI' },
            { id: 'midjourney', name: 'Midjourney', icon: 'fa-image', d: 'Art Generation' },
            { id: 'dalle', name: 'DALL-E 3', icon: 'fa-paint-brush', d: 'Photo realism' },
            { id: 'flux', name: 'Flux.1', icon: 'fa-wand-magic-sparkles', d: 'Next-gen Art' },
            { id: 'codex', name: 'Codex', icon: 'fa-code', d: 'Coding expert' },
            { id: 'deepseek', name: 'DeepSeek', icon: 'fa-microscope', d: 'Science & Logic' },
            { id: 'perplex', name: 'Perplexity', icon: 'fa-search', d: 'Live Search' },
            { id: 'grok', name: 'Grok-1', icon: 'fa-x', d: 'Real-time X' },
            { id: 'sora', name: 'Sora', icon: 'fa-video', d: 'Video FX' },
            { id: 'stable', name: 'SDXL', icon: 'fa-palette', d: 'Local Diffusion' }
        ];

        const App = {
            currentModel: 'gpt4',
            
            init() {
                document.getElementById('u-name').innerText = (tg.initDataUnsafe?.user?.first_name || "UNIT").toUpperCase();
                if(tg.initDataUnsafe?.user?.photo_url) {
                    document.getElementById('u-avatar').src = tg.initDataUnsafe.user.photo_url;
                }

                const container = document.getElementById('ai-container');
                models.forEach(m => {
                    const el = document.createElement('div');
                    el.className = `ai-card ${m.id === this.currentModel ? 'active' : ''}`;
                    el.innerHTML = `<i class="fa-solid ${m.icon}"></i><div class="name">${m.name}</div><div class="desc">${m.d}</div>`;
                    
                    // Mouse tracking for gradient effect
                    el.addEventListener('mousemove', (e) => {
                        const rect = el.getBoundingClientRect();
                        el.style.setProperty('--mouse-x', `${((e.clientX - rect.left) / rect.width) * 100}%`);
                        el.style.setProperty('--mouse-y', `${((e.clientY - rect.top) / rect.height) * 100}%`);
                    });
                    
                    el.onclick = () => {
                        document.querySelectorAll('.ai-card').forEach(c => c.classList.remove('active'));
                        el.classList.add('active');
                        this.currentModel = m.id;
                        tg.HapticFeedback.selectionChanged();
                        
                        // Smooth scale animation
                        gsap.fromTo(el, { scale: 0.96 }, { scale: 1, duration: 0.4, ease: 'power2.out' });
                    };
                    
                    container.appendChild(el);
                });
                
                this.sync();
            },
            
            async sync() {
                try {
                    const r = await fetch(`${API_URL}/get-user?id=${tg.initDataUnsafe?.user?.id || 0}`);
                    const d = await r.json();
                    document.getElementById('u-credits').innerText = `CREDITS: ${d.credits || 0}`;
                    if(d.credits > 1000) {
                        document.getElementById('ach-rich').classList.add('unlocked');
                    }
                    this.unlockAch(JSON.parse(d.achievements || '["boot"]'));
                } catch(e) {
                    console.log('Sync error:', e);
                }
            },
            
            unlockAch(list) {
                list.forEach(a => {
                    const el = document.getElementById(`ach-${a}`);
                    if(el) {
                        el.classList.add('unlocked');
                        gsap.fromTo(el, { scale: 0.95, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.7)' });
                    }
                });
            },
            
            switch(view, btn) {
                tg.HapticFeedback.impactOccurred('medium');
                
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.querySelectorAll('.view').forEach(v => {
                    v.classList.remove('active');
                });
                
                const nextView = document.getElementById('view-' + view);
                nextView.classList.add('active');
                
                // Smooth entrance animation
                gsap.fromTo(nextView, 
                    { opacity: 0, y: 20, scale: 0.97 },
                    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out' }
                );
                
                document.getElementById('chat-input-box').style.display = view === 'ai' ? 'flex' : 'none';
                
                // Input field animation
                if(view === 'ai') {
                    gsap.fromTo('#chat-input-box', 
                        { y: 20, opacity: 0 },
                        { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out', delay: 0.1 }
                    );
                }
            },
            
            send() {
                const p = document.getElementById('main-prompt').value;
                if(!p) return;
                
                // Button press animation
                gsap.to('.send-btn', { scale: 0.9, duration: 0.1, yoyo: true, repeat: 1 });
                
                tg.sendData(JSON.stringify({ action: "generate", model: this.currentModel, prompt: p }));
                tg.close();
            },
            
            pay(method) {
                tg.HapticFeedback.notificationOccurred('success');
                tg.sendData(JSON.stringify({ action: "pay", method: method }));
                tg.close();
            }
        };

        const Scene3D = {
            init() {
                const container = document.getElementById('canvas-3d');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
                
                renderer.setSize(container.offsetWidth, container.offsetHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                // Create multiple geometric shapes for visual interest
                const geo = new THREE.IcosahedronGeometry(2, 2);
                const mat = new THREE.MeshBasicMaterial({ 
                    color: 0x00f3ff, 
                    wireframe: true, 
                    transparent: true, 
                    opacity: 0.08 
                });
                const mesh = new THREE.Mesh(geo, mat);
                scene.add(mesh);

                // Add particles
                const particlesGeo = new THREE.BufferGeometry();
                const particlesCount = 200;
                const posArray = new Float32Array(particlesCount * 3);
                
                for(let i = 0; i < particlesCount * 3; i++) {
                    posArray[i] = (Math.random() - 0.5) * 8;
                }
                
                particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                const particlesMat = new THREE.PointsMaterial({
                    size: 0.02,
                    color: 0x00f3ff,
                    transparent: true,
                    opacity: 0.5
                });
                const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
                scene.add(particlesMesh);

                camera.position.z = 5;

                // Optimized animation loop
                let time = 0;
                function animate() {
                    requestAnimationFrame(animate);
                    time += 0.001;
                    
                    mesh.rotation.y += 0.002;
                    mesh.rotation.x += 0.001;
                    
                    particlesMesh.rotation.y -= 0.0005;
                    particlesMesh.position.y = Math.sin(time) * 0.2;
                    
                    renderer.render(scene, camera);
                }
                animate();

                // Handle resize
                window.addEventListener('resize', () => {
                    camera.aspect = container.offsetWidth / container.offsetHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.offsetWidth, container.offsetHeight);
                });
            }
        };

        // Initialize app
        window.onload = () => {
            App.init();
            Scene3D.init();
            
            // Smooth loader animation
            gsap.to('.loader-fill', { 
                width: '100%', 
                duration: 1.8, 
                ease: 'power2.inOut',
                onComplete: () => {
                    gsap.to('#loader', { 
                        opacity: 0, 
                        duration: 0.6, 
                        ease: 'power3.in',
                        onComplete: () => {
                            document.getElementById('loader').style.display = 'none';
                            
                            // Entrance animation for header
                            gsap.fromTo('.header', 
                                { y: -20, opacity: 0 },
                                { y: 0, opacity: 1, duration: 0.8, ease: 'power3.out' }
                            );
                            
                            gsap.fromTo('.user-card', 
                                { x: -20, opacity: 0 },
                                { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out', delay: 0.2 }
                            );
                            
                            gsap.fromTo('.stats-row', 
                                { y: 20, opacity: 0 },
                                { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out', delay: 0.3 }
                            );
                            
                            gsap.fromTo('.ai-card', 
                                { y: 30, opacity: 0, scale: 0.9 },
                                { 
                                    y: 0, 
                                    opacity: 1, 
                                    scale: 1, 
                                    duration: 0.6, 
                                    ease: 'power3.out',
                                    stagger: 0.05,
                                    delay: 0.4
                                }
                            );
                        }
                    });
                }
            });
        };
    </script>
</body>
