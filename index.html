<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --ios-bg: #000;
            --glass: rgba(255, 255, 255, 0.08);
            --neon: #00f2ff;
            --ultra: #ff00ff;
        }

        body { margin: 0; background: var(--ios-bg); color: #fff; font-family: -apple-system, system-ui; height: 100vh; overflow: hidden; }

        /* LIQUID BACKGROUND */
        .liquid-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 20% 30%, #00243d 0%, transparent 40%), radial-gradient(circle at 80% 70%, #2d003d 0%, transparent 40%); filter: blur(60px); }

        /* BOOT SCREEN */
        #boot { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s; }
        .logo-glow { width: 80px; height: 80px; background: #fff; border-radius: 20px; box-shadow: 0 0 40px #fff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }

        /* iOS GLASS PANELS */
        .glass-panel { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; margin: 15px; padding: 20px; }
        
        .header { padding: 40px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 28px; font-weight: 800; letter-spacing: -1px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px; }
        .card { background: var(--glass); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; position: relative; overflow: hidden; }
        .card:active { transform: scale(0.95); background: rgba(255,255,255,0.15); }
        .card.active { border-color: var(--neon); box-shadow: 0 0 15px rgba(0,242,255,0.3); }
        
        .c-icon { font-size: 24px; color: var(--neon); margin-bottom: 10px; }
        .c-name { font-weight: 700; font-size: 15px; }

        /* INPUT AREA */
        .dock { position: fixed; bottom: 30px; left: 15px; right: 15px; display: flex; gap: 10px; }
        .ios-input { flex: 1; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 15px 20px; color: #fff; font-size: 16px; outline: none; backdrop-filter: blur(10px); }
        .send-btn { width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #000; border: none; font-size: 20px; cursor: pointer; }

        /* SHOP SHEET */
        .sheet-btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 700; margin-bottom: 10px; font-size: 16px; transition: 0.2s; }
        .sheet-btn:active { transform: scale(0.98); }
        .btn-pro { background: #fff; color: #000; }
        .btn-ultra { background: linear-gradient(90deg, #ff00ff, #00f2ff); color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: flex-end; z-index: 500; }
        .sheet { width: 100%; background: #1c1c1e; border-radius: 30px 30px 0 0; padding: 30px; animation: slide 0.3s ease-out; }
        @keyframes slide { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="liquid-bg"></div>

    <div id="boot">
        <div class="logo-glow"></div>
        <p style="margin-top:25px; font-weight:600; letter-spacing:2px; opacity:0.5;">TITAN OS</p>
    </div>

    <div class="header">
        <div class="title">Titan <span style="color:var(--neon)">AI</span></div>
        <div onclick="openShop()" style="background:var(--glass); padding:8px 15px; border-radius:20px; font-size:12px; border:1px solid rgba(255,255,255,0.1)">UPGRADE</div>
    </div>

    <div class="grid" id="main-grid">
        <div class="card active" onclick="selectModel('GPT-5', this)">
            <i class="fa-solid fa-bolt c-icon"></i>
            <div class="c-name">GPT-5 Pro</div>
        </div>
        <div class="card" onclick="selectModel('CLAUDE', this)">
            <i class="fa-solid fa-wand-magic-sparkles c-icon" style="color:#ffcc00"></i>
            <div class="c-name">Claude 3.5</div>
        </div>
        <div class="card" onclick="selectModel('CODE', this)">
            <i class="fa-solid fa-code c-icon" style="color:#20c20e"></i>
            <div class="c-name">Dev Core</div>
        </div>
        <div class="card" onclick="selectModel('MIDJOURNEY', this)">
            <i class="fa-solid fa-image c-icon" style="color:var(--ultra)"></i>
            <div class="c-name">Midjourney</div>
        </div>
    </div>

    <div class="modal" id="shop">
        <div class="sheet">
            <h2 style="margin-top:0">Choose Plan</h2>
            <div style="margin-bottom:20px; color:#888;">Unlock all 8 models and database access.</div>
            
            <button class="sheet-btn btn-pro" onclick="pay('PRO', 'stars')">⭐ TITAN PRO - 140 XTR</button>
            <button class="sheet-btn btn-ultra" onclick="pay('ULTRA', 'stars')">⭐ TITAN ULTRA - 230 XTR</button>
            <button class="sheet-btn" style="background:#222; color:#fff;" onclick="pay('ULTRA', 'crypto')">💎 CryptoBot (USDT)</button>
            <button class="sheet-btn" style="background:transparent; color:#555;" onclick="closeShop()">Cancel</button>
        </div>
    </div>

    <div class="dock">
        <input type="text" class="ios-input" id="prompt" placeholder="Message Titan...">
        <button class="send-btn" onclick="send()"><i class="fa-solid fa-arrow-up"></i></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let model = 'GPT-5';

        // BOOT SEQUENCE
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('boot').style.opacity = '0';
                setTimeout(() => document.getElementById('boot').style.display = 'none', 800);
                tg.HapticFeedback.notificationOccurred('success');
            }, 1800);
        };

        function selectModel(m, el) {
            tg.HapticFeedback.impactOccurred('light');
            model = m;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function openShop() {
            tg.HapticFeedback.impactOccurred('medium');
            document.getElementById('shop').style.display = 'flex';
        }

        function closeShop() {
            document.getElementById('shop').style.display = 'none';
        }

        function pay(plan, method) {
            tg.HapticFeedback.notificationOccurred('warning');
            tg.sendData(JSON.stringify({ action: "payment", plan: plan, method: method }));
            setTimeout(() => tg.close(), 150);
        }

        function send() {
            const val = document.getElementById('prompt').value;
            if(!val) return;
            tg.HapticFeedback.impactOccurred('medium');
            tg.sendData(JSON.stringify({ action: "generate", model: model, prompt: val }));
            setTimeout(() => tg.close(), 150);
        }
    </script>
</body>
</html>
