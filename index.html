<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IZUUP AI ULTIMATE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #0a0a0c; --card: #161618; --accent: #00d2ff; --text: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; overflow: hidden; }
        .page { display: none; height: 100vh; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .page.active { display: flex; }
        
        /* Заглушка для чата */
        #chat-lock {
            position: absolute; top: 0; left: 0; right: 0; bottom: 80px;
            background: rgba(10,10,12,0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; text-align: center; padding: 20px;
        }

        .balance-card { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); border-radius: 24px; padding: 25px; text-align: center; margin-bottom: 20px; }
        .list-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.05); padding: 18px; border-radius: 18px; width: 100%; color: white; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        
        #chat-window { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 140px; }
        .input-bar { position: fixed; bottom: 85px; left: 15px; right: 15px; background: #1c1c1e; border-radius: 20px; padding: 8px 15px; display: flex; align-items: center; gap: 12px; }
        input { background: transparent; border: none; color: white; flex-grow: 1; outline: none; }
        
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f11; display: flex; justify-content: space-around; padding: 15px 0 25px; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav i { color: #555; font-size: 22px; }
        .nav i.active { color: var(--accent); }
    </style>
</head>
<body>

    <div id="p-home" class="page active">
        <div class="balance-card">
            <div style="font-size: 38px; font-weight: 900;" id="user-bal">1,200 VC</div>
            <div id="sub-label">Статус: Без подписки</div>
        </div>
        <button class="list-btn" onclick="showP('chat')"><b>Открыть AI Чат</b> <i class="fa-solid fa-comment"></i></button>
        <button class="list-btn" onclick="showP('shop')"><b>Магазин (ULTIMATE)</b> <i class="fa-solid fa-shop"></i></button>
    </div>

    <div id="p-chat" class="page">
        <div id="chat-lock">
            <i class="fa-solid fa-lock" style="font-size: 40px; color: var(--accent); margin-bottom: 15px;"></i>
            <h3>Чат заблокирован</h3>
            <p style="color: #888;">Для доступа к Gemini, Claude и Genie купите подписку в магазине.</p>
            <button class="list-btn" style="background: var(--accent); color: #000;" onclick="showP('shop')">Перейти в магазин</button>
        </div>
        <div id="chat-window"></div>
        <div class="input-bar">
            <input type="text" placeholder="Спросите ИИ...">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
    </div>

    <div id="p-shop" class="page">
        <h2>Магазин</h2>
        <button class="list-btn" onclick="act('buy_ultimate')">
            <span>Все нейросети (ULTIMATE)</span>
            <b style="background:#fff; color:#000; padding:4px 8px; border-radius:5px;">2300 VC</b>
        </button>
        <h3>Пополнение баланса</h3>
        <button class="list-btn" onclick="act('pay_stars')"><i class="fa-solid fa-star" style="color:gold;"></i> Stars</button>
        <button class="list-btn" onclick="act('pay_crypto')"><i class="fa-solid fa-coins" style="color:#00ff88;"></i> Crypto Bot</button>
    </div>

    <div class="nav">
        <i class="fa-solid fa-house active" onclick="showP('home')"></i>
        <i class="fa-solid fa-comment" onclick="showP('chat')"></i>
        <i class="fa-solid fa-wallet" onclick="showP('shop')"></i>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Имитация данных (в реальности нужно получать из БД бота)
        let hasPremium = false; 

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            
            // Если зашли в чат и есть преимум - убираем замок
            if (id === 'chat' && hasPremium) {
                document.getElementById('chat-lock').style.display = 'none';
            }
        }

        function act(cmd) {
            tg.HapticFeedback.notificationOccurred('success');
            // ВАЖНО: Мы используем MainButton для отправки, так как sendData может блокироваться
            tg.sendData(cmd);
            tg.close();
        }

        // Если бот передал нам, что юзер премиум (через initData)
        // Здесь можно добавить логику проверки
    </script>
</body>
</html>
