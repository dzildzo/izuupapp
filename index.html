<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --accent: #00f2ff; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; padding-top: calc(env(safe-area-inset-top) + 10px); }
        .page { flex: 1; overflow-y: auto; display: none; padding: 20px; }
        .page.active { display: block; }
        .card { background: #111; border: 1px solid #333; padding: 20px; border-radius: 18px; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; color: #000; }
        .btn-stars { background: #f9d71c; }
        .btn-crypto { background: var(--accent); }
        .nav { height: 75px; background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-i { font-size: 24px; color: #444; }
        .nav-i.active { color: var(--accent); }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight:900;">TITAN <span style="color:var(--accent)">OS</span></div>
    <div style="font-weight:bold; color:var(--accent)">100 VC</div>
</div>

<div id="p-chat" class="page active">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div class="card" style="text-align:center; border-color:var(--accent)">GPT-5</div>
        <div class="card" style="text-align:center;">SORA 2</div>
    </div>
    <p style="text-align:center; color:#555; margin-top:50px;">Все системы активны.<br>Выберите режим и введите запрос.</p>
</div>

<div id="p-shop" class="page">
    <div class="card">
        <div style="font-size:18px; font-weight:bold;">PRO ACCESS</div>
        <div class="btn-group">
            <button class="btn btn-stars" onclick="pay('PRO', 'stars')">⭐ 140</button>
            <button class="btn btn-crypto" onclick="pay('PRO', 'crypto')">USDT 14</button>
        </div>
    </div>
    <div class="card" style="border-color: gold;">
        <div style="font-size:18px; font-weight:bold; color:gold;">ULTRA TITAN</div>
        <div class="btn-group">
            <button class="btn btn-stars" onclick="pay('ULTRA', 'stars')">⭐ 230</button>
            <button class="btn btn-crypto" onclick="pay('ULTRA', 'crypto')">USDT 23</button>
        </div>
    </div>
</div>

<div class="nav">
    <i class="fa-solid fa-terminal nav-i active" onclick="tab('chat', this)"></i>
    <i class="fa-solid fa-cart-shopping nav-i" onclick="tab('shop', this)"></i>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function tab(name, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-i').forEach(n => n.classList.remove('active'));
        document.getElementById('p-' + name).classList.add('active');
        el.classList.add('active');
    }

    function pay(plan, method) {
        tg.HapticFeedback.impactOccurred('medium');
        // Отправка данных боту и закрытие приложения
        tg.sendData(JSON.stringify({
            action: "payment",
            plan: plan,
            method: method
        }));
    }
</script>
</body>
</html>
