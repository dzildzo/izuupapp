<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PoulAI Ultimate Console</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --bg: #050505; --card: #121214; --accent: #00d2ff; 
            --grad: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
            --glass: rgba(255, 255, 255, 0.05);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; overflow: hidden; height: 100vh; }

        .page { display: none; height: 100vh; flex-direction: column; padding: 20px; padding-bottom: 100px; overflow-y: auto; }
        .active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* HEADER */
        .balance-card { background: var(--grad); border-radius: 25px; padding: 25px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0, 210, 255, 0.2); }

        /* BUTTONS */
        .btn { background: var(--card); border: 1px solid var(--glass); padding: 18px; border-radius: 20px; width: 100%; color: white; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }

        /* CHAT */
        #chat-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
        .bubble { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; }
        .ai { background: var(--glass); align-self: flex-start; }
        .user { background: var(--grad); color: black; align-self: flex-end; font-weight: 600; }

        .input-area { position: fixed; bottom: 85px; left: 15px; right: 15px; display: flex; gap: 8px; background: #0a0a0c; padding: 8px; border-radius: 25px; border: 1px solid var(--glass); align-items: center; }
        .input-area input { background: transparent; border: none; color: white; flex: 1; padding: 8px; outline: none; }
        .input-area i { font-size: 20px; color: #666; cursor: pointer; padding: 0 5px; }

        /* MODAL */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: #1a1a1c; border-radius: 25px; padding: 25px; width: 100%; max-width: 320px; text-align: center; border: 1px solid var(--accent); }

        /* NAV */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(10,10,12,0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--glass); }
        .nav-item { color: #444; font-size: 22px; transition: 0.3s; }
        .nav-item.active { color: var(--accent); }

        .promo-box { background: var(--card); padding: 15px; border-radius: 20px; margin-top: 20px; border: 1px dashed var(--accent); }
    </style>
</head>
<body>

    <div id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Выбрать способ</h3>
            <button class="btn" style="border-color: #f9d71c;" onclick="confirmPay('stars')"><span>Telegram Stars</span> <i class="fa-solid fa-star" style="color:#f9d71c"></i></button>
            <button class="btn" style="border-color: #00d2ff;" onclick="confirmPay('crypto')"><span>Crypto Bot</span> <i class="fa-solid fa-coins"></i></button>
            <button class="btn" style="background: transparent; border: none;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <div id="p-home" class="page active">
        <div class="balance-card">
            <p style="margin:0; opacity:0.6; font-size: 12px;">AVAILABLE BALANCE</p>
            <h1 id="b-val" style="font-size: 45px; margin: 5px 0;">0 VC</h1>
            <span id="s-tag" style="background:rgba(0,0,0,0.3); padding:4px 12px; border-radius:10px; font-size:11px;">FREE</span>
        </div>
        <button class="btn" onclick="showP('chat')"><span>AI Chat Console</span> <i class="fa-solid fa-terminal"></i></button>
        <button class="btn" onclick="showP('shop')"><span>Upgrade Status</span> <i class="fa-solid fa-crown"></i></button>
        
        <div class="promo-box">
            <input type="text" id="promo-in" placeholder="Введите промокод" style="background:transparent; border:none; color:white; width:100%; outline:none; margin-bottom:10px;">
            <button class="btn" style="background:var(--accent); color:black; margin:0; padding:10px;" onclick="sendPromo()">Активировать</button>
        </div>
    </div>

    <div id="p-chat" class="page">
        <div id="chat-content">
            <div class="bubble ai">Консоль активна. Вы можете отправить текст или файл для анализа.</div>
        </div>
        <div class="input-area">
            <i class="fa-solid fa-paperclip" onclick="tg.showAlert('Функция загрузки файлов будет доступна после настройки Storage')"></i>
            <input type="text" id="ai-in" placeholder="Сообщение...">
            <i class="fa-solid fa-circle-arrow-up" style="color:var(--accent)" onclick="askAI()"></i>
        </div>
    </div>

    <div id="p-shop" class="page">
        <h2>Магазин</h2>
        <div class="btn" onclick="openPayModal('PRO', 1400)">
            <div><b>Тариф PRO</b><br><small style="opacity:0.5">Gemini Flash</small></div>
            <span style="background:var(--accent); color:black; padding:4px 8px; border-radius:8px;">1400 VC</span>
        </div>
        <div class="btn" onclick="openPayModal('ULTRA', 2300)">
            <div><b>Тариф ULTRA</b><br><small style="opacity:0.5">Gemini Pro</small></div>
            <span style="background:#f9d71c; color:black; padding:4px 8px; border-radius:8px;">2300 VC</span>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showP('home')"><i class="fa-solid fa-gauge-high"></i></div>
        <div class="nav-item" onclick="showP('chat')"><i class="fa-solid fa-comment-dots"></i></div>
        <div class="nav-item" onclick="showP('shop')"><i class="fa-solid fa-basket-shopping"></i></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedPlan = '';

        function showP(id) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach((it, idx) => {
                it.classList.toggle('active', ['home', 'chat', 'shop'][idx] === id);
            });
        }

        // РАБОТА С МОДАЛКОЙ
        function openPayModal(plan, price) {
            selectedPlan = plan;
            document.getElementById('modal-title').innerText = `Купить ${plan}`;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        function confirmPay(method) {
            tg.HapticFeedback.notificationOccurred('success');
            // Мы НЕ закрываем приложение, просто отправляем данные
            tg.sendData(`pay_${method}_${selectedPlan}`);
            closeModal();
            tg.showAlert(`Запрос на оплату ${selectedPlan} отправлен в чат!`);
        }

        function askAI() {
            const inp = document.getElementById('ai-in');
            if(!inp.value) return;
            const chat = document.getElementById('chat-content');
            chat.innerHTML += `<div class="bubble user">${inp.value}</div>`;
            tg.sendData("msg:" + inp.value);
            inp.value = '';
            chat.scrollTop = chat.scrollHeight;
        }

        function sendPromo() {
            const val = document.getElementById('promo-in').value;
            if(val) {
                tg.sendData("promo:" + val);
                tg.showAlert("Промокод отправлен на проверку!");
                document.getElementById('promo-in').value = '';
            }
        }

        // Синхронизация данных
        const params = new URLSearchParams(window.location.search);
        document.getElementById('b-val').innerText = (params.get('bal') || '0') + ' VC';
        document.getElementById('s-tag').innerText = (params.get('sub') || 'free').toUpperCase();
    </script>
</body>
</html>
