<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --bg: #050505; --card: rgba(20, 20, 25, 0.9); }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .container { height: 100vh; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid #222; margin-bottom: 10px; }
        .bal-val { color: var(--neon); font-size: 20px; font-weight: 800; text-shadow: 0 0 10px var(--neon); }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .model-btn { background: var(--card); border: 1px solid #222; padding: 12px 5px; border-radius: 15px; text-align: center; font-size: 11px; transition: 0.2s; }
        .model-btn.active { border-color: var(--neon); box-shadow: 0 0 10px rgba(0,242,255,0.2); }
        .model-btn i { display: block; font-size: 18px; margin-bottom: 5px; color: var(--neon); }

        .input-area { background: var(--card); border-radius: 20px; border: 1px solid #222; padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        textarea { flex-grow: 1; background: none; border: none; color: #fff; outline: none; resize: none; font-size: 14px; }
        
        .pay-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .pay-btn { padding: 12px; border-radius: 12px; font-size: 12px; font-weight: bold; text-align: center; cursor: pointer; }
        .btn-stars { background: #f9d71c; color: #000; }
        .btn-crypto { background: var(--neon); color: #000; }

        .send-btn { background: #fff; color: #000; padding: 15px; border-radius: 15px; text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div><small style="color:#555">BALANCE</small><div class="bal-val" id="bal">0 VC</div></div>
        <div style="text-align:right"><small style="color:#555">CORE</small><div id="sub" style="color:var(--neon)">FREE</div></div>
    </div>

    <div class="grid">
        <div class="model-btn active" onclick="setM('GPT4', this)"><i class="fa-solid fa-brain"></i>GPT-4o</div>
        <div class="model-btn" onclick="setM('CLAUDE', this)"><i class="fa-solid fa-bolt"></i>Claude 3</div>
        <div class="model-btn" onclick="setM('GEMINI', this)"><i class="fa-solid fa-gem"></i>Gemini Pro</div>
        <div class="model-btn" onclick="setM('VEO3', this)"><i class="fa-solid fa-video"></i>Veo 3</div>
        <div class="model-btn" onclick="setM('SORA2', this)"><i class="fa-solid fa-film"></i>Sora 2</div>
        <div class="model-btn" onclick="setM('GENIE', this)"><i class="fa-solid fa-cube"></i>Genie S</div>
    </div>

    <div class="input-area">
        <textarea id="prompt" placeholder="Введите ваш запрос или описание видео..."></textarea>
        
        <div style="font-size: 10px; color: #444; margin-top: 10px;">UPGRADE SUBSCRIPTION:</div>
        <div class="pay-row">
            <div class="pay-btn btn-crypto" onclick="pay('crypto', 'PRO')">PRO 14$</div>
            <div class="pay-btn btn-crypto" onclick="pay('crypto', 'ULTRA')">ULTRA 23$</div>
        </div>
        <div class="pay-row" style="margin-top: 5px;">
            <div class="pay-btn btn-stars" onclick="pay('stars', 'PRO')">PRO ⭐ 140</div>
            <div class="pay-btn btn-stars" onclick="pay('stars', 'ULTRA')">ULTRA ⭐ 230</div>
        </div>
        
        <div class="send-btn" onclick="send()">RUN SYSTEM ENGINE</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let model = 'GPT4';

    function setM(m, el) {
        tg.HapticFeedback.impactOccurred('light');
        model = m;
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function pay(method, plan) {
        tg.HapticFeedback.impactOccurred('heavy');
        tg.sendData(`pay_${method}_${plan}`);
    }

    function send() {
        const p = document.getElementById('prompt').value;
        if(!p) return;
        tg.HapticFeedback.notificationOccurred('success');
        const type = ['VEO3', 'SORA2', 'GENIE'].includes(model) ? 'media' : 'ai';
        tg.sendData(`${type}:${model}|${p}`);
        tg.close();
    }

    const u = new URLSearchParams(window.location.search);
    document.getElementById('bal').innerText = (u.get('bal') || 0) + ' VC';
    document.getElementById('sub').innerText = (u.get('sub') || 'FREE').toUpperCase();
</script>
</body>
</html>
