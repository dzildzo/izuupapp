<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --accent: #00f2ff; --bg: #000; --card: #121214; --brd: #222; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        
        body { margin: 0; background: var(--bg); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ЭФФЕКТ СКАНЛАЙНОВ */
        body::before {
            content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 1000;
        }

        /* BOOT SCREEN */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .boot-logo { font-size: 28px; font-weight: 900; letter-spacing: 5px; margin-bottom: 20px; }
        .boot-logo span { color: var(--accent); text-shadow: 0 0 15px var(--accent); }
        .loader-bar { width: 200px; height: 2px; background: #111; overflow: hidden; border-radius: 2px; }
        .loader-fill { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: load 2s forwards; }
        @keyframes load { to { width: 100%; } }

        .header { 
            padding: 15px 20px; border-bottom: 1px solid var(--brd); display: flex; justify-content: space-between; align-items: center; 
            background: #0a0a0a; padding-top: calc(env(safe-area-inset-top) + 10px);
        }

        .content { flex-grow: 1; overflow-y: auto; padding: 15px; padding-bottom: 180px; }
        .page { display: none; } .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* MINING CARD */
        .mine-card {
            background: linear-gradient(45deg, #111, #1a1a1e); border: 1px solid var(--brd);
            border-radius: 20px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .mine-info b { display: block; font-size: 14px; color: var(--accent); }
        .mine-info span { font-size: 11px; color: #666; }
        .mine-btn { 
            background: var(--accent); color: #000; border: none; padding: 10px 15px; border-radius: 12px; 
            font-weight: 900; font-size: 12px; cursor: pointer; transition: 0.3s;
        }
        .mine-btn:disabled { background: #222; color: #555; }

        .sys-logs { font-family: monospace; font-size: 9px; color: var(--accent); opacity: 0.5; margin-bottom: 10px; height: 12px; overflow: hidden; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .m-card { 
            background: var(--card); border: 1px solid var(--brd); padding: 18px 10px; border-radius: 18px; 
            text-align: center; height: 90px; display: flex; flex-direction: column; justify-content: center;
        }
        .m-card.active { border-color: var(--accent); background: rgba(0,242,255,0.05); }
        .m-card i { font-size: 20px; margin-bottom: 5px; color: #444; }
        .m-card.active i { color: var(--accent); }
        .m-card b { font-size: 11px; text-transform: uppercase; }

        .shop-box { background: var(--card); border: 1px solid var(--brd); border-radius: 20px; padding: 20px; margin-bottom: 12px; }
        .btn-row { display: flex; gap: 8px; margin-top: 15px; }
        .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 800; font-size: 13px; cursor: pointer; }
        .btn-s { background: #f9d71c; color: #000; }
        .btn-c { background: var(--accent); color: #000; }

        .input-zone { position: fixed; bottom: 85px; width: 100%; padding: 0 15px; }
        .input-bar { background: #1a1a1e; border: 1px solid var(--brd); border-radius: 25px; padding: 8px 15px; display: flex; align-items: center; }
        textarea { flex: 1; background: none; border: none; color: #fff; height: 24px; outline: none; resize: none; font-size: 16px; }

        .nav { 
            position: fixed; bottom: 0; width: 100%; height: 75px; background: #0a0a0a; border-top: 1px solid var(--brd); 
            display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav i { font-size: 22px; color: #444; padding: 10px 20px; }
        .nav i.active { color: var(--accent); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="boot-logo">TITAN<span>OS</span></div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <div class="header">
        <div style="font-weight:900; letter-spacing:1px;">TITAN <span style="color:var(--accent)">OS</span></div>
        <div id="bal" style="background:var(--accent); color:#000; padding:4px 12px; border-radius:12px; font-weight:900; font-size:12px;">100 VC</div>
    </div>

    <div class="content">
        <div id="p-chat" class="page active">
            <div class="mine-card">
                <div class="mine-info">
                    <b id="mine-status">TITAN MINER: READY</b>
                    <span id="mine-timer">Доступно: +1.00 VC</span>
                </div>
                <button class="mine-btn" id="mine-btn" onclick="startMining()">COLLECT</button>
            </div>
            <div class="sys-logs" id="logs">RUNNING SYSTEM_CORE...</div>
            <div class="grid">
                <div class="m-card active" onclick="setM('GPT-5', this)"><i class="fa-solid fa-brain"></i><b>GPT-5</b></div>
                <div class="m-card" onclick="setM('CLAUDE-3.5', this)"><i class="fa-solid fa-code"></i><b>Claude 3.5</b></div>
                <div class="m-card" onclick="setM('SORA-2', this)"><i class="fa-solid fa-video"></i><b>Sora-2</b></div>
                <div class="m-card" onclick="setM('VEO-3', this)"><i class="fa-solid fa-film"></i><b>Veo-3</b></div>
                <div class="m-card" onclick="setM('MJ-V6', this)"><i class="fa-solid fa-palette"></i><b>MJ V6</b></div>
                <div class="m-card" onclick="setM('GENIE-3D', this)"><i class="fa-solid fa-cube"></i><b>Genie 3D</b></div>
            </div>
        </div>

        <div id="p-shop" class="page">
            <div class="shop-box">
                <b>PRO ACCESS</b>
                <div class="btn-row">
                    <button class="btn btn-s" onclick="pay('PRO','stars')">⭐ 140</button>
                    <button class="btn btn-c" onclick="pay('PRO','crypto')">USDT 14</button>
                </div>
            </div>
            <div class="shop-box ultra">
                <b style="color:gold">ULTRA TITAN</b>
                <div class="btn-row">
                    <button class="btn btn-s" onclick="pay('ULTRA','stars')">⭐ 230</button>
                    <button class="btn btn-c" onclick="pay('ULTRA','crypto')">USDT 23</button>
                </div>
            </div>
        </div>
    </div>

    <div class="input-zone" id="in-z">
        <div class="input-bar">
            <textarea id="txt" placeholder="Командная строка..."></textarea>
            <i class="fa-solid fa-arrow-up" style="color:var(--accent); margin-left:12px;" onclick="send()"></i>
        </div>
    </div>

    <div class="nav">
        <i class="fa-solid fa-terminal active" onclick="tab('chat',this)"></i>
        <i class="fa-solid fa-gem" onclick="tab('shop',this)"></i>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let currentBal = 100;
        let model = 'GPT-5';

        // ЛОГИ
        const logLines = ["ENCRYPTING...", "SYNCING...", "TITAN CORE ACTIVE.", "READY."];
        setInterval(() => { document.getElementById('logs').innerText = logLines[Math.floor(Math.random() * logLines.length)]; }, 3000);

        // МАЙНИНГ
        function startMining() {
            tg.HapticFeedback.notificationOccurred('success');
            currentBal += 1;
            document.getElementById('bal').innerText = currentBal + ' VC';
            const btn = document.getElementById('mine-btn');
            btn.disabled = true;
            setTimeout(() => { btn.disabled = false; }, 3600000); // 1 час
        }

        window.onload = () => { setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 2200); };

        function tab(id, el) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav i').forEach(n => n.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active');
            el.classList.add('active');
            document.getElementById('in-z').style.display = id === 'chat' ? 'block' : 'none';
        }

        function setM(m, el) {
            tg.HapticFeedback.selectionChanged();
            model = m;
            document.querySelectorAll('.m-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        // --- ФИКС ОПЛАТЫ ---
        function pay(plan, method) {
            tg.HapticFeedback.notificationOccurred('success');
            // Шлем данные боту. Бот увидит "payment" и пришлет инвойс.
            tg.sendData(JSON.stringify({ action:"payment", plan:plan, method:method }));
            // Обязательно закрываем приложение, чтобы юзер увидел инвойс в чате!
            tg.close();
        }

        function send() {
            const val = document.getElementById('txt').value;
            if(!val) return;
            tg.sendData(JSON.stringify({ action:"generate", model:model, prompt:val }));
            tg.close();
        }
    </script>
</body>
</html>
// Вставь это в свой <script> внутри HTML
function pay(plan, method) {
    tg.HapticFeedback.notificationOccurred('success');
    
    // 1. Отправляем данные боту
    tg.sendData(JSON.stringify({ 
        action: "payment", 
        plan: plan, 
        method: method 
    }));
    
    // 2. МГНОВЕННО ЗАКРЫВАЕМ, чтобы инвойс появился в чате
    setTimeout(() => {
        tg.close();
    }, 150); 
}

function send() {
    const val = document.getElementById('txt').value;
    if(!val) return;
    tg.sendData(JSON.stringify({ action: "generate", model: model, prompt: val }));
    // Здесь тоже закрываем, чтобы увидеть ответ бота
    setTimeout(() => { tg.close(); }, 150);
}
