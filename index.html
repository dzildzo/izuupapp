<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PoulAI Ultra</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #050505; --accent: #00d2ff; --card: #121214; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; overflow: hidden; }
        .page { display: none; height: 100vh; padding: 20px; flex-direction: column; }
        .active { display: flex; }
        .btn { background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; color: white; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .balance-card { background: linear-gradient(135deg, #00d2ff, #3a7bd5); padding: 30px; border-radius: 20px; text-align: center; margin-bottom: 20px; transition: transform 0.2s; }
        .nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #0a0a0c; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav i { font-size: 20px; color: #444; }
        .nav .active i { color: var(--accent); }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="modal">
    <div style="background:#1a1a1c; padding:30px; border-radius:25px; width:80%; text-align:center;">
        <h3>Способ оплаты</h3>
        <div class="btn" onclick="confirmPay('stars')" style="border-color:#f9d71c">Telegram Stars ⭐</div>
        <div class="btn" onclick="confirmPay('crypto')" style="border-color:#00d2ff">Crypto Bot 💎</div>
        <p onclick="document.getElementById('modal').style.display='none'">Отмена</p>
    </div>
</div>

<div id="p-home" class="page active">
    <div class="balance-card">
        <small>BALANCE</small>
        <h1 id="bal">0 VC</h1>
        <div id="sub" style="font-size:12px; opacity:0.7">FREE</div>
    </div>
    <div class="btn" onclick="showP('chat')">Открыть AI Чат <i class="fa-solid fa-ghost"></i></div>
    <div class="btn" onclick="showP('shop')">Купить подписку <i class="fa-solid fa-crown"></i></div>
    <input type="text" id="promo" placeholder="Промокод..." style="width:100%; padding:15px; border-radius:15px; background:#121214; border:1px dashed var(--accent); color:white; margin-top:10px;">
    <button onclick="sendPromo()" style="width:100%; margin-top:5px; padding:10px; border-radius:10px; background:var(--accent); border:none;">Ок</button>
</div>

<div id="p-chat" class="page">
    <div id="chat-box" style="flex:1; overflow-y:auto; padding-bottom:100px;"></div>
    <div style="position:fixed; bottom:80px; width:90%; left:5%; display:flex; gap:10px; background:#121214; padding:10px; border-radius:20px;">
        <i class="fa-solid fa-paperclip" onclick="tg.showAlert('Файлы скоро!')"></i>
        <input id="ai-msg" style="flex:1; background:none; border:none; color:white; outline:none;" placeholder="Спроси PoulAI...">
        <i class="fa-solid fa-paper-plane" style="color:var(--accent)" onclick="sendMsg()"></i>
    </div>
</div>

<div id="p-shop" class="page">
    <h2>Магазин</h2>
    <div class="btn" onclick="openShop('PRO')">Тариф PRO <span>1400 VC</span></div>
    <div class="btn" onclick="openShop('ULTRA')">Тариф ULTRA <span>2300 VC</span></div>
</div>

<div class="nav">
    <div onclick="showP('home')" id="n-home" class="active"><i class="fa-solid fa-house"></i></div>
    <div onclick="showP('chat')" id="n-chat"><i class="fa-solid fa-message"></i></div>
    <div onclick="showP('shop')" id="n-shop"><i class="fa-solid fa-shop"></i></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let selectedPlan = '';

    // БЫСТРЫЙ ЗАПУСК: Берем данные из кэша
    document.getElementById('bal').innerText = localStorage.getItem('bal') || '0 VC';
    document.getElementById('sub').innerText = localStorage.getItem('sub') || 'FREE';

    // ОБНОВЛЕНИЕ ДАННЫХ ИЗ URL
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('bal')) {
        const b = urlParams.get('bal') + ' VC';
        const s = urlParams.get('sub').toUpperCase();
        document.getElementById('bal').innerText = b;
        document.getElementById('sub').innerText = s;
        localStorage.setItem('bal', b);
        localStorage.setItem('sub', s);
    }

    function showP(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav div').forEach(n => n.classList.remove('active'));
        document.getElementById('p-'+id).classList.add('active');
        document.getElementById('n-'+id).classList.add('active');
    }

    function openShop(plan) { selectedPlan = plan; document.getElementById('modal').style.display='flex'; }
    
    function confirmPay(m) {
        tg.sendData(`pay_${m}_${selectedPlan}`);
        document.getElementById('modal').style.display='none';
    }

    function sendPromo() {
        const val = document.getElementById('promo').value;
        if(val) { tg.sendData("promo:" + val); document.getElementById('promo').value=''; }
    }

    function sendMsg() {
        const val = document.getElementById('ai-msg').value;
        if(!val) return;
        const cb = document.getElementById('chat-box');
        cb.innerHTML += `<p><b>Вы:</b> ${val}</p>`;
        tg.sendData("msg:" + val);
        document.getElementById('ai-msg').value = '';
    }
</script>
</body>
</html>
