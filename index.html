<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --neon: #00f3ff; --dark: #050505; --panel: rgba(10, 15, 20, 0.85); --warn: #ff003c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Courier New', monospace; user-select: none; }
        
        body { margin: 0; background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* MATRIX BACKGROUND */
        #matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.15; pointer-events: none; }

        /* SCANLINES & VIGNETTE */
        .overlay { position: fixed; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,1) 100%); background-size: 100% 3px, 100% 100%; z-index: 999; pointer-events: none; }

        /* LOADING SCREEN */
        #boot { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .glitch-text { font-size: 40px; font-weight: bold; text-shadow: 2px 0 var(--warn), -2px 0 var(--neon); letter-spacing: 5px; animation: glitch 1s infinite; }
        @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }

        /* UI ELEMENTS */
        .app-container { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid rgba(0, 243, 255, 0.3); backdrop-filter: blur(5px); }
        .status { font-size: 10px; color: var(--neon); display: flex; gap: 10px; }
        .blink { animation: blink 2s infinite; } @keyframes blink { 50% { opacity: 0; } }

        .content { flex: 1; overflow-y: auto; padding-top: 15px; }
        .page { display: none; animation: slideUp 0.3s ease; } .page.active { display: block; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* CARDS */
        .card { background: var(--panel); border: 1px solid rgba(0, 243, 255, 0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; overflow: hidden; transition: 0.2s; }
        .card:active { transform: scale(0.98); border-color: var(--neon); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--neon); }
        
        .ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .ai-btn { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 15px; border-radius: 6px; text-align: center; cursor: pointer; }
        .ai-btn.selected { border-color: var(--neon); background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        
        .shop-btn { width: 100%; padding: 15px; margin-top: 5px; background: transparent; border: 1px solid var(--neon); color: var(--neon); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; position: relative; overflow: hidden; }
        .shop-btn::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent); transition: 0.5s; }
        .shop-btn:hover::after { left: 100%; }

        /* INPUT AREA */
        .input-area { margin-top: auto; padding-top: 10px; display: flex; gap: 10px; }
        .cmd-input { flex: 1; background: #000; border: 1px solid #333; color: var(--neon); padding: 12px; font-family: monospace; outline: none; border-radius: 4px; }
        .cmd-input:focus { border-color: var(--neon); }
        .send-btn { background: var(--neon); color: #000; border: none; width: 50px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* AUDIO VISUALIZER (FAKE) */
        .viz { display: flex; gap: 2px; height: 15px; align-items: flex-end; }
        .bar { width: 3px; background: var(--neon); animation: bounce 0.5s infinite; }
        @keyframes bounce { 0%, 100% { height: 2px; } 50% { height: 100%; } }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="overlay"></div>

    <div id="boot">
        <div class="glitch-text">TITAN OS</div>
        <div style="margin-top:20px; color:#666; font-size:10px;">INITIALIZING CORE SYSTEMS...</div>
    </div>

    <div class="app-container">
        <div class="header">
            <div><i class="fa-solid fa-microchip"></i> TITAN <span style="color:var(--neon)">PRO</span></div>
            <div class="status">
                <span class="blink">NET: ON</span>
                <span>PWR: 98%</span>
            </div>
        </div>

        <div class="content">
            <div id="p-chat" class="page active">
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="color:var(--neon)">SYSTEM_LOG</span>
                        <div class="viz">
                            <div class="bar" style="animation-duration:0.2s"></div>
                            <div class="bar" style="animation-duration:0.4s"></div>
                            <div class="bar" style="animation-duration:0.3s"></div>
                        </div>
                    </div>
                    <div style="font-size:11px; opacity:0.7; line-height:1.4;">
                        > CONNECTED TO NEURAL LINK<br>
                        > WAITING FOR INPUT...<br>
                        > MODEL: GEMINI-1.5-FLASH [ACTIVE]
                    </div>
                </div>

                <div style="font-size:10px; margin-bottom:5px; color:#666;">SELECT MODEL MODULE:</div>
                <div class="ai-grid">
                    <div class="ai-btn selected" onclick="setModel('GPT-5', this)"><i class="fa-solid fa-brain"></i><br>GPT-5</div>
                    <div class="ai-btn" onclick="setModel('CLAUDE', this)"><i class="fa-solid fa-code"></i><br>CLAUDE</div>
                    <div class="ai-btn" onclick="setModel('MIDJOURNEY', this)"><i class="fa-solid fa-eye"></i><br>VISION</div>
                    <div class="ai-btn" onclick="setModel('GEMINI', this)"><i class="fa-brands fa-google"></i><br>GEMINI</div>
                </div>
            </div>

            <div id="p-shop" class="page">
                <div class="card" style="border-color:gold">
                    <h3 style="color:gold; margin:0 0 10px 0;">ULTIMATE ACCESS</h3>
                    <p style="font-size:11px; color:#aaa;">Unlock full speed, no limits, priority queue.</p>
                    <button class="shop-btn" style="border-color:gold; color:gold;" onclick="pay('ULTRA', 'stars')">⭐ 230 XTR</button>
                    <button class="shop-btn" style="margin-top:10px;" onclick="pay('ULTRA', 'crypto')">USDT 23</button>
                </div>
                <div class="card">
                    <h3 style="color:var(--neon); margin:0 0 10px 0;">PRO ACCESS</h3>
                    <button class="shop-btn" onclick="pay('PRO', 'stars')">⭐ 140 XTR</button>
                    <button class="shop-btn" style="margin-top:10px;" onclick="pay('PRO', 'crypto')">USDT 14</button>
                </div>
            </div>
        </div>

        <div class="input-area" id="input-box">
            <input type="text" class="cmd-input" id="prompt" placeholder="ENTER COMMAND...">
            <button class="send-btn" onclick="send()"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div style="display:flex; justify-content:space-around; padding-top:15px; border-top:1px solid #222; margin-top:15px;">
            <i class="fa-solid fa-terminal fa-lg" style="color:var(--neon); cursor:pointer;" onclick="nav('chat')"></i>
            <i class="fa-solid fa-gem fa-lg" style="color:#666; cursor:pointer;" onclick="nav('shop')"></i>
        </div>
    </div>

    <audio id="snd-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="snd-send" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        let model = 'GPT-5';

        // --- MATRIX RAIN EFFECT ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = '01AZTITAN';
        const drops = Array(Math.floor(canvas.width / 10)).fill(1);
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00f3ff';
            ctx.font = '10px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * 10, drops[i] * 10);
                if (drops[i] * 10 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // --- BOOT SEQUENCE ---
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('boot').style.opacity = '0';
                setTimeout(() => document.getElementById('boot').style.display = 'none', 500);
                tg.HapticFeedback.impactOccurred('heavy');
            }, 2000);
        };

        // --- NAVIGATION & LOGIC ---
        function playSnd(id) { document.getElementById(id).currentTime=0; document.getElementById(id).play().catch(()=>{}); }

        function nav(page) {
            playSnd('snd-click');
            tg.HapticFeedback.selectionChanged();
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-'+page).classList.add('active');
            
            // Управление цветом иконок
            const icons = document.querySelectorAll('.fa-lg');
            icons[0].style.color = page === 'chat' ? 'var(--neon)' : '#666';
            icons[1].style.color = page === 'shop' ? 'var(--neon)' : '#666';

            // Скрываем инпут в магазине
            document.getElementById('input-box').style.opacity = page === 'chat' ? '1' : '0';
            document.getElementById('input-box').style.pointerEvents = page === 'chat' ? 'all' : 'none';
        }

        function setModel(m, el) {
            playSnd('snd-click');
            tg.HapticFeedback.impactOccurred('light');
            model = m;
            document.querySelectorAll('.ai-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        function send() {
            const val = document.getElementById('prompt').value;
            if(!val) return;
            
            playSnd('snd-send');
            tg.HapticFeedback.notificationOccurred('success');
            
            tg.sendData(JSON.stringify({ action: "generate", model: model, prompt: val }));
            // Закрываем с задержкой, чтобы юзер услышал звук
            setTimeout(() => tg.close(), 300);
        }

        function pay(plan, method) {
            playSnd('snd-click');
            tg.HapticFeedback.notificationOccurred('warning');
            
            tg.sendData(JSON.stringify({ action: "payment", plan: plan, method: method }));
            // Критично для Stars
            setTimeout(() => tg.close(), 100);
        }
    </script>
</body>
</html>
