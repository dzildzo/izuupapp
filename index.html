<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --accent: #00f2ff; --bg: #000; --card: #121214; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .header { padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; padding-top: calc(env(safe-area-inset-top) + 10px); background: #0a0a0a; }
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 180px; }
        .page { display: none; } .page.active { display: block; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .m-card { background: var(--card); border: 1px solid #333; padding: 20px 10px; border-radius: 20px; text-align: center; transition: 0.2s; }
        .m-card.active { border-color: var(--accent); background: rgba(0, 242, 255, 0.05); }
        .m-card i { font-size: 22px; color: #444; margin-bottom: 8px; display: block; }
        .m-card.active i { color: var(--accent); }
        .m-card b { font-size: 13px; letter-spacing: 0.5px; }

        .shop-box { background: var(--card); border: 1px solid #333; border-radius: 24px; padding: 25px; margin-bottom: 15px; }
        .shop-box.ultra { border-color: gold; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 18px; border-radius: 15px; border: none; font-weight: 900; font-size: 14px; cursor: pointer; }
        .btn-s { background: #f9d71c; color: #000; }
        .btn-c { background: var(--accent); color: #000; }

        .input-zone { position: fixed; bottom: 85px; width: 100%; padding: 0 15px; }
        .input-bar { background: #1a1a1e; border: 1px solid #333; border-radius: 30px; padding: 8px 18px; display: flex; align-items: center; }
        textarea { flex: 1; background: none; border: none; color: #fff; height: 26px; outline: none; resize: none; font-size: 16px; padding-top: 4px; }

        .nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav i { font-size: 24px; color: #444; }
        .nav i.active { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight:900; letter-spacing:1px;">TITAN <span style="color:var(--accent)">OS</span></div>
        <div id="bal" style="background:var(--accent); color:#000; padding:5px 12px; border-radius:15px; font-weight:bold; font-size:13px;">100 VC</div>
    </div>

    <div class="content">
        <div id="p-chat" class="page active">
            <div class="grid">
                <div class="m-card active" onclick="setM('GPT-5', this)"><i class="fa-solid fa-brain"></i><b>GPT-5</b></div>
                <div class="m-card" onclick="setM('CLAUDE-3.5', this)"><i class="fa-solid fa-bolt"></i><b>CLAUDE 3.5</b></div>
                <div class="m-card" onclick="setM('SORA-2', this)"><i class="fa-solid fa-video"></i><b>SORA-2</b></div>
                <div class="m-card" onclick="setM('VEO-3', this)"><i class="fa-solid fa-camera-movie"></i><b>VEO-3</b></div>
                <div class="m-card" onclick="setM('MJ-V6', this)"><i class="fa-solid fa-palette"></i><b>MJ V6</b></div>
                <div class="m-card" onclick="setM('GENIE-3D', this)."><i class="fa-solid fa-cube"></i><b>GENIE 3D</b></div>
            </div>
        </div>

        <div id="p-shop" class="page">
            <div class="shop-box">
                <b style="font-size:18px">PRO ACCESS</b>
                <p style="color:#666; font-size:12px">GPT-5 + Работа с файлами</p>
                <div class="btn-row">
                    <button class="btn btn-s" onclick="pay('PRO','stars')">⭐ 140</button>
                    <button class="btn btn-c" onclick="pay('PRO','crypto')">USDT 14</button>
                </div>
            </div>
            <div class="shop-box ultra">
                <b style="font-size:18px; color:gold">ULTRA TITAN</b>
                <p style="color:#666; font-size:12px">Sora 2 + Veo 3 + Genie 3D</p>
                <div class="btn-row">
                    <button class="btn btn-s" onclick="pay('ULTRA','stars')">⭐ 230</button>
                    <button class="btn btn-c" onclick="pay('ULTRA','crypto')">USDT 23</button>
                </div>
            </div>
        </div>
    </div>

    <div class="input-zone" id="in-z">
        <div class="input-bar">
            <i class="fa-solid fa-paperclip" style="color:#555; margin-right:12px; font-size:20px" onclick="tg.showAlert('Скрепите файл в чате бота!')"></i>
            <textarea id="txt" placeholder="Введите запрос..."></textarea>
            <i class="fa-solid fa-paper-plane" style="color:var(--accent); margin-left:12px; font-size:20px" onclick="send()"></i>
        </div>
    </div>

    <div class="nav">
        <i class="fa-solid fa-terminal active" onclick="tab('chat',this)"></i>
        <i class="fa-solid fa-rocket" onclick="tab('shop',this)"></i>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let model = 'GPT-5';

        function tab(id, el) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav i').forEach(n => n.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active');
            el.classList.add('active');
            document.getElementById('in-z').style.display = id === 'chat' ? 'block' : 'none';
        }

        function setM(m, el) {
            tg.HapticFeedback.selectionChanged();
            model = m;
            document.querySelectorAll('.m-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function pay(plan, method) {
            tg.HapticFeedback.notificationOccurred('success');
            tg.sendData(JSON.stringify({ action:"payment", plan:plan, method:method }));
        }

        function send() {
            const val = document.getElementById('txt').value;
            if(!val) return;
            tg.sendData(JSON.stringify({ action:"generate", model:model, prompt:val }));
            tg.close();
        }

        const u = new URLSearchParams(window.location.search);
        document.getElementById('bal').innerText = (u.get('bal') || 100) + ' VC';
    </script>
</body>
</html>
