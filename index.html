<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --accent: #00f2ff;
            --bg: #000000;
            --card-bg: #111113;
            --border: #222225;
            --text-dim: #66666e;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            padding: 20px 20px 15px;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: calc(env(safe-area-inset-top) + 15px);
            z-index: 100;
        }

        .logo { font-weight: 900; letter-spacing: 2px; font-size: 18px; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        .balance {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
        }

        /* PAGES */
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 180px; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .model-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px 15px;
            border-radius: 20px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
        }
        .model-card i { font-size: 24px; margin-bottom: 10px; color: var(--text-dim); }
        .model-card.active { border-color: var(--accent); background: rgba(0, 242, 255, 0.03); }
        .model-card.active i { color: var(--accent); }
        .model-card span { display: block; font-weight: bold; font-size: 14px; }

        /* SHOP */
        .shop-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 24px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .shop-card.ultra { border-color: #f9d71c; box-shadow: 0 0 15px rgba(249, 215, 28, 0.1); }
        .shop-card h3 { margin: 0; font-size: 20px; font-weight: 900; }
        .shop-card p { color: var(--text-dim); font-size: 13px; margin: 8px 0 20px; }

        .btn-row { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 16px;
            border: none;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-stars { background: #f9d71c; color: #000; }
        .btn-crypto { background: var(--accent); color: #000; }

        /* INPUT AREA */
        .input-container {
            position: fixed;
            bottom: 85px;
            left: 0; width: 100%;
            padding: 0 20px;
            background: linear-gradient(to top, var(--bg) 80%, transparent);
            z-index: 90;
        }
        .input-wrapper {
            background: #1a1a1e;
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
        }
        textarea {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            outline: none;
            resize: none;
            height: 24px;
            font-size: 16px;
            font-family: inherit;
        }

        /* NAV */
        .nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { color: var(--text-dim); font-size: 22px; transition: 0.2s; padding: 10px 20px; }
        .nav-item.active { color: var(--accent); }

    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TITAN <span>OS</span></div>
        <div class="balance" id="bal">0 VC</div>
    </div>

    <div class="content">
        <div id="p-chat" class="page active">
            <div class="grid">
                <div class="model-card active" onclick="setModel('GPT-5', this)">
                    <i class="fa-solid fa-brain"></i>
                    <span>GPT-5</span>
                </div>
                <div class="model-card" onclick="setModel('SORA-2', this)">
                    <i class="fa-solid fa-video"></i>
                    <span>SORA-2</span>
                </div>
                <div class="model-card" onclick="setModel('VEO-3', this)">
                    <i class="fa-solid fa-clapperboard"></i>
                    <span>VEO-3</span>
                </div>
                <div class="model-card" onclick="setModel('MJ-V6', this)">
                    <i class="fa-solid fa-palette"></i>
                    <span>MJ V6</span>
                </div>
            </div>
            <div style="margin-top: 30px; text-align: center; color: var(--text-dim); font-size: 12px; letter-spacing: 1px;">
                <i class="fa-solid fa-shield-halved"></i> SYSTEM SECURE & ACTIVE
            </div>
        </div>

        <div id="p-shop" class="page">
            <div class="shop-card">
                <h3>PRO CORE</h3>
                <p>Доступ к GPT-5, MJ V6 и работа с документами без ограничений.</p>
                <div class="btn-row">
                    <button class="btn btn-stars" onclick="handlePay('PRO', 'stars')">
                        <i class="fa-solid fa-star"></i> 140
                    </button>
                    <button class="btn btn-crypto" onclick="handlePay('PRO', 'crypto')">
                        <i class="fa-brands fa-usdt"></i> 14.0
                    </button>
                </div>
            </div>

            <div class="shop-card ultra">
                <h3 style="color: #f9d71c;">ULTRA TITAN</h3>
                <p>Полный доступ к SORA-2, VEO-3 и Genie 3D. Приоритетный рендеринг.</p>
                <div class="btn-row">
                    <button class="btn btn-stars" onclick="handlePay('ULTRA', 'stars')">
                        <i class="fa-solid fa-star"></i> 230
                    </button>
                    <button class="btn btn-crypto" onclick="handlePay('ULTRA', 'crypto')">
                        <i class="fa-brands fa-usdt"></i> 23.0
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="input-container" id="input-box">
        <div class="input-wrapper">
            <textarea id="prompt" placeholder="Командная строка..."></textarea>
            <i class="fa-solid fa-paper-plane" style="color: var(--accent); margin-left: 15px; font-size: 20px;" onclick="handleSend()"></i>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="changeTab('chat', this)">
            <i class="fa-solid fa-terminal"></i>
        </div>
        <div class="nav-item" onclick="changeTab('shop', this)">
            <i class="fa-solid fa-layer-group"></i>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        let currentModel = 'GPT-5';

        function changeTab(pageId, element) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('p-' + pageId).classList.add('active');
            element.classList.add('active');
            
            document.getElementById('input-box').style.display = (pageId === 'chat' ? 'block' : 'none');
        }

        function setModel(m, el) {
            tg.HapticFeedback.selectionChanged();
            currentModel = m;
            document.querySelectorAll('.model-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function handlePay(plan, method) {
            tg.HapticFeedback.notificationOccurred('success');
            const data = JSON.stringify({
                action: "payment",
                plan: plan,
                method: method
            });
            tg.sendData(data);
            // На iOS sendData инициирует закрытие, но мы добавим close для надежности
            setTimeout(() => tg.close(), 100);
        }

        function handleSend() {
            const text = document.getElementById('prompt').value;
            if (!text) return;
            tg.HapticFeedback.impactOccurred('medium');
            tg.sendData(JSON.stringify({
                action: "generate",
                model: currentModel,
                prompt: text
            }));
            tg.close();
        }

        // Парсинг баланса из URL
        const params = new URLSearchParams(window.location.search);
        const balance = params.get('bal') || '100';
        document.getElementById('bal').innerText = balance + ' VC';

    </script>
</body>
</html>
