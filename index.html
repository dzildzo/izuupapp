<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PoulAI Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --bg: #0a0a0c; --card: #1c1c1e; --accent: #007AFF; --text: #fff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; overflow: hidden; }
        
        .page { display: none; height: 100vh; flex-direction: column; }
        .page.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
        .btn { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 14px; width: 100%; font-size: 16px; font-weight: 600; margin-bottom: 10px; cursor: pointer; }
        .btn-gray { background: #2c2c2e; }

        /* Профиль и Промокоды */
        .profile-info { text-align: left; background: #252529; padding: 15px; border-radius: 15px; margin-top: 10px; border: 1px solid #444; }
        .promo-input { display: flex; gap: 10px; margin-top: 20px; }
        input#promo-field { background: #1c1c1e; border: 1px solid #444; color: white; padding: 12px; border-radius: 12px; flex: 1; outline: none; }

        /* Навигация */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f11; display: flex; justify-content: space-around; padding: 15px 0 25px; border-top: 1px solid #222; }
        .nav i { color: #555; font-size: 22px; cursor: pointer; }
        .nav i.active { color: var(--accent); }

        #chat-window { flex-grow: 1; overflow-y: auto; padding-bottom: 100px; }
    </style>
</head>
<body>

    <div id="p-home" class="page active">
        <div class="card">
            <h1 id="bal-view" style="margin:0; font-size: 36px;">0 VC</h1>
            <p style="opacity: 0.5;">Ваш баланс</p>
        </div>
        <button class="btn" onclick="showP('chat')">Открыть Чат</button>
        <button class="btn btn-gray" onclick="showP('shop')">Магазин</button>
    </div>

    <div id="p-profile" class="page">
        <h2>Профиль</h2>
        <div class="card">
            <div class="profile-info">
                <p>👤 Имя: <span id="prof-name">Пользователь</span></p>
                <p>🆔 ID: <span id="prof-id">000000</span></p>
                <p>💎 Подписка: <span id="prof-sub">Free</span></p>
            </div>
        </div>

        <h3>Активация кода</h3>
        <div class="promo-input">
            <input type="text" id="promo-field" placeholder="Введите промокод...">
            <button class="btn" style="width: auto; margin:0; padding: 12px 20px;" onclick="activatePromo()">OK</button>
        </div>
    </div>

    <div id="p-chat" class="page"><h3>Чат...</h3></div>
    <div id="p-shop" class="page"><h3>Магазин...</h3></div>

    <div class="nav">
        <i class="fa-solid fa-house active" onclick="showP('home')"></i>
        <i class="fa-solid fa-comment" onclick="showP('chat')"></i>
        <i class="fa-solid fa-wallet" onclick="showP('shop')"></i>
        <i class="fa-solid fa-user" onclick="showP('profile')"></i>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Данные из URL
        const params = new URLSearchParams(window.location.search);
        const sub = params.get('sub');
        const bal = params.get('bal');

        // Данные пользователя из Telegram
        const user = tg.initDataUnsafe.user || { id: "Demo", first_name: "Гость" };

        document.getElementById('bal-view').innerText = (bal || 0) + ' VC';
        document.getElementById('prof-id').innerText = user.id;
        document.getElementById('prof-name').innerText = user.first_name;
        document.getElementById('prof-sub').innerText = sub === 'ultimate' ? 'ULTIMATE' : 'Free';

        function showP(id) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            
            // Подсветка иконок
            document.querySelectorAll('.nav i').forEach(i => i.classList.remove('active'));
            const icons = { home: 0, chat: 1, shop: 2, profile: 3 };
            document.querySelectorAll('.nav i')[icons[id]].classList.add('active');
        }

        function activatePromo() {
            const code = document.getElementById('promo-field').value.trim();
            if(code) {
                tg.sendData("promo:" + code);
                tg.close(); // Закрываем, чтобы бот ответил
            }
        }

        function sendToBot(data) {
            tg.sendData(data);
            tg.close();
        }
    </script>
</body>
</html>
