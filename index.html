<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IZUUP AI App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .card { background: linear-gradient(135deg, #1e1e1e 0%, #121212 100%); width: 90%; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; margin-top: 20px; }
        .balance-title { color: #888; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 36px; font-weight: bold; background: linear-gradient(45deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; transition: 0.3s; }
        .btn-main { background: #00d2ff; color: #000; }
        .btn-sec { background: #222; color: white; border: 1px solid #444; }
        .status { margin-top: 10px; font-size: 14px; color: #00ff88; }
    </style>
</head>
<body>
    <img src="https://cdn-icons-png.flaticon.com/512/2103/2103633.png" width="80" style="margin-top: 40px;">
    <h2>IZUUP AI</h2>
    
    <div class="card">
        <div class="balance-title">Твой Баланс</div>
        <div class="balance-value" id="user-bal">... VC</div>
        <div class="status">● Система готова</div>
    </div>

    <button class="btn btn-main" onclick="Telegram.WebApp.showAlert('Скоро здесь будет магазин!')">🚀 Купить VC</button>
    <button class="btn btn-sec" onclick="Telegram.WebApp.close()">Закрыть</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // В реальном приложении данные берутся через API твоего бота
        document.getElementById('user-bal').innerText = "1200 VC";
    </script>
</body>
</html>
