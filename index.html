<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #0a0a0c; color: white; margin: 0; padding: 20px; }
        .card { background: #161618; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
        .btn { background: #007AFF; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-pay { background: #222; border: 1px solid #444; }
        .page { display: none; }
        .active { display: block; }
        #chat-box { height: 300px; overflow-y: auto; background: #000; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        .lock { text-align: center; padding: 40px 10px; background: rgba(0,0,0,0.9); border-radius: 15px; }
    </style>
</head>
<body>

    <div id="home" class="page active">
        <div class="card">
            <h2 id="bal">0 VC</h2>
            <p>Ваш баланс</p>
        </div>
        <button class="btn" onclick="go('chat')">Открыть Чат</button>
        <button class="btn btn-pay" onclick="go('shop')">Пополнить / Подписка</button>
    </div>

    <div id="chat" class="page">
        <div id="sub-lock" class="lock">
            <i class="fa-solid fa-lock" style="font-size: 40px; color: #007AFF;"></i>
            <h3>Нужна подписка ULTIMATE</h3>
            <button class="btn" onclick="go('shop')">Купить доступ</button>
        </div>
        <div id="chat-content" style="display:none">
            <div id="chat-box">Чат готов...</div>
            <input type="text" style="width:70%; padding:10px; border-radius:10px;">
            <button class="btn" style="width:25%; display:inline">-></button>
        </div>
        <br><button class="btn btn-pay" onclick="go('home')">Назад</button>
    </div>

    <div id="shop" class="page">
        <h3>Магазин</h3>
        <button class="btn" onclick="send('buy_ultimate')">Купить ULTIMATE (2300 VC)</button>
        <button class="btn btn-pay" onclick="send('pay_stars')">Оплатить Stars ⭐</button>
        <button class="btn btn-pay" onclick="send('pay_crypto')">Оплатить Crypto ₿</button>
        <br><button class="btn btn-pay" onclick="go('home')">Назад</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Читаем данные из ссылки от бота
        const urlParams = new URLSearchParams(window.location.search);
        const sub = urlParams.get('sub');
        const balance = urlParams.get('bal');

        if(balance) document.getElementById('bal').innerText = balance + ' VC';
        if(sub === 'ultimate') {
            document.getElementById('sub-lock').style.display = 'none';
            document.getElementById('chat-content').style.display = 'block';
        }

        function go(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function send(data) {
            tg.sendData(data); // Отправляет боту команду и закрывает окно
        }
    </script>
</body>
</html>
